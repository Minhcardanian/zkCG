services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zkcg
      POSTGRES_USER: zkcg
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - zkcg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkcg -d zkcg"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  zkcg_pg:
